/* ---- speed layer: remembered answers, quick-add chips and "what is left" ---- */
const RECENT_KEY = "pricer-recent-v1";
function loadRecent(kind) {
  try { const r = JSON.parse(localStorage.getItem(RECENT_KEY)); const l = r && Array.isArray(r[kind]) ? r[kind] : []; return l.filter((x) => typeof x === "string"); } catch (e) { return []; }
}
function pushRecent(kind, val) {
  const v = String(val || "").trim();
  if (v.length < 3) return;
  try {
    let r = null; try { r = JSON.parse(localStorage.getItem(RECENT_KEY)); } catch (e) { r = null; }
    if (!r || typeof r !== "object") r = {};
    const list = Array.isArray(r[kind]) ? r[kind] : [];
    r[kind] = [v].concat(list.filter((x) => x !== v)).slice(0, 8);
    localStorage.setItem(RECENT_KEY, JSON.stringify(r));
  } catch (e) { /* storage unavailable */ }
}
/* small one-tap suggestions under an empty field: your own recent entries first, then any fixed starters */
function RecentChips({ kind, value, onPick, starters, label }) { return null; /* decluttered */ 
  if (String(value || "").trim()) return null;
  const seen = new Set();
  const list = loadRecent(kind).concat(starters || []).filter((x) => { const k = x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
  if (!list.length) return null;
  return html`<div className="rchips" role="group" aria-label=${label || "Quick fill"}><span className="rchips-l">${label || "Quick fill"}</span>
    ${list.map((x) => html`<button type="button" key=${x} className="rchip" onClick=${() => onPick(x)}>${x}</button>`)}</div>`;
}

function goTo(id) {
  try {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    if (typeof el.focus === "function" && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(el.tagName)) el.focus({ preventScroll: true });
  } catch (e) { /* ignore */ }
}
/* steps: [{ id: element id to jump to, label, next: wording for the Next button, done, opt }]. Optional steps are shown but not counted. */
function JobProgress({ title, steps, doneText, onDone, doneLabel }) { return null; /* decluttered */ 
  const req = steps.filter((s) => !s.opt);
  const left = req.filter((s) => !s.done);
  const n = req.length - left.length;
  const pct = req.length ? Math.round((n / req.length) * 100) : 100;
  const next = left[0];
  return html`<div className="progress" role="status" aria-live="polite">
    <div className="progress-top"><span>${title}</span><span className="progress-n">${n} of ${req.length} done</span></div>
    <div className="progress-bar" aria-hidden="true"><i style=${{ width: pct + "%" }}></i></div>
    <div className="progress-steps">${steps.map((s, i) => html`<button type="button" key=${i + s.id} className=${"pstep" + (s.done ? " done" : "") + (s.opt ? " opt" : "")} onClick=${() => goTo(s.id)}>${s.done ? "\u2713 " : ""}${s.label}${s.opt && !s.done ? " (optional)" : ""}</button>`)}</div>
    ${next ? html`<button type="button" className="btn btn-accent progress-next" onClick=${() => goTo(next.id)}>Next: ${next.next || next.label}</button>`
      : onDone ? html`<button type="button" className="btn btn-accent progress-next" onClick=${onDone}>${doneLabel || "Carry on"}</button>`
      : html`<p className="note">${doneText || "Everything needed is filled in."}</p>`}
  </div>`;
}

function CopyQuote({ text, label, cls, btnCls }) {
  const [state, setState] = useState("idle"); // idle | copied | manual
  const areaRef = useRef(null);
  useEffect(() => {
    if (state === "manual" && areaRef.current) { areaRef.current.focus(); areaRef.current.select(); }
    if (state === "copied") { const t = setTimeout(() => setState("idle"), 2000); return () => clearTimeout(t); }
    return undefined;
  }, [state]);
  const doCopy = () => {
    const fallback = () => setState("manual");
    const sent = () => { setState("copied"); try { window.dispatchEvent(new Event("jobpricer:sent")); } catch (e) { /* ignore */ } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(sent, fallback);
      } else { fallback(); }
    } catch (err) { fallback(); }
  };
  return html`<div className=${cls || ""}>
    <button type="button" className=${btnCls || "btn"} onClick=${doCopy}><${Icon} name="copy" /> ${state === "copied" ? "Copied" : (label || "Copy estimate as text")}</button>
    ${state === "manual" ? html`<${Sheet} title="Copy this text" onClose=${() => setState("idle")} foot=${html`<button type="button" className="btn btn-accent" style=${{ width: "100%" }} onClick=${() => setState("idle")}>Done</button>`}>
      <p className="note">Copying isn't available here. The text is selected below, so copy it with your keyboard.</p>
      <textarea ref=${areaRef} className="manual" readOnly value=${text} aria-label="Estimate text"></textarea>
    <//>` : null}
  </div>`;
}

/* Build a PDF in the page and offer it to the phone's share sheet (WhatsApp etc.), or download it.
   Lays the estimate text out as a proper page: coloured header, details box, headed sections,
   bullets, figures lined up on the right, a highlighted total, tick boxes for the order list and page numbers. */
async function makeAndSharePdf(sections, filename) {
  const lib = window.jspdf && window.jspdf.jsPDF;
  if (!lib) throw new Error("The PDF tool did not load. Check your connection and try again.");
  const prettyPdf = (doc) => {
  const PW = 595, PH = 842, M = 48, W = PW - M * 2, BOTTOM = PH - 56;
  const INK = [33, 35, 39], SOFT = [100, 103, 108], ACC = [205, 100, 18], TINT = [252, 239, 226], RULE = [208, 210, 213];
  const fill = (c) => doc.setFillColor(c[0], c[1], c[2]);
  const ink = (c) => doc.setTextColor(c[0], c[1], c[2]);
  const stroke = (c) => doc.setDrawColor(c[0], c[1], c[2]);
  const font = (st, sz, c) => { doc.setFont("helvetica", st); doc.setFontSize(sz); ink(c || INK); };
  const wrap = (t, w) => doc.splitTextToSize(String(t), Math.max(40, w));
  const MONEY = /^(.*?)(?: — |: )((?:approx )?£[\d,]+(?:\.\d+)?)(?: \(([^)]*)\))?$/;
  let y = M, bizName = "", dateStr = "";
  const need = (h) => { if (y + h > BOTTOM) { doc.addPage(); y = M; } };
  const gap = (h) => { y += h; };
  const lab = (mm) => mm[1] + (mm[3] ? " (" + mm[3] + ")" : "");

  const header = (title, sub) => {
    fill(ACC); doc.rect(0, 0, PW, 84, "F");
    font("bold", 21, [255, 255, 255]); doc.text(wrap(title, W)[0], M, 40);
    font("normal", 11, [214, 238, 235]); doc.text(sub, M, 62);
    y = 84 + 22;
  };
  const heading = (t) => {
    need(70); gap(10);
    const cut = t.indexOf(" ("), note = cut > 0 && t.length > 42 ? t.slice(cut + 2).replace(/\)?:$/, "") : "";
    const main = (note ? t.slice(0, cut) : t).replace(/:$/, "");
    font("bold", 11.5, ACC); doc.text(main.toUpperCase(), M, y);
    stroke(ACC); doc.setLineWidth(1); doc.line(M, y + 5, M + W, y + 5);
    y += 21;
    if (note) para(note.replace(/^./, (c) => c.toUpperCase()) + ".", { size: 9, color: SOFT });
  };
  const para = (t, o) => {
    o = o || {}; const sz = o.size || 10.5, lh = o.lh || sz * 1.4, ind = o.indent || 0;
    font(o.style || "normal", sz, o.color);
    wrap(t, W - ind).forEach((w) => { need(lh); doc.text(w, M + ind, y); y += lh; });
  };
  const bullet = (t, level) => {
    const ind = 12 + level * 14, lh = 14.5;
    font("normal", level ? 10 : 10.5, level ? SOFT : INK);
    const lines = wrap(t, W - ind - 4);
    need(lh * Math.min(lines.length, 2));
    fill(level ? SOFT : ACC); doc.circle(M + ind - 7, y - 3.4, level ? 1.3 : 1.8, "F");
    lines.forEach((w, k) => { need(lh); font("normal", level ? 10 : 10.5, level ? SOFT : INK); doc.text(w, M + ind, y); y += lh; });
  };
  const money = (label, amt, o) => {
    o = o || {}; const ind = o.indent || 0, sz = o.size || 10.5, lh = sz * 1.45;
    font(o.style || "normal", sz, o.color);
    const aw = doc.getTextWidth(amt), lines = wrap(label, W - ind - aw - 14);
    need(lh * lines.length + (o.box ? 12 : 0));
    if (o.box) { y += 6; fill(TINT); doc.roundedRect(M - 6, y - sz - 2, W + 12, lines.length * lh + 8, 3, 3, "F"); font(o.style || "normal", sz, o.color); }
    lines.forEach((w, k) => { doc.text(w, M + ind, y + k * lh); });
    doc.text(amt, M + W, y + (lines.length - 1) * lh, { align: "right" });
    y += lines.length * lh + (o.box ? 6 : 0);
    if (!o.box && o.rule) { stroke(RULE); doc.setLineWidth(0.5); doc.line(M, y - lh + 4, M + W, y - lh + 4); }
  };
  const tick = (checked, label, amt) => {
    const lh = 15.5, bx = 11;
    font("normal", 10.5, INK);
    const aw = amt ? doc.getTextWidth(amt) : 0, lines = wrap(label, W - 26 - aw - 12);
    need(lh * lines.length);
    stroke(SOFT); doc.setLineWidth(0.9); doc.rect(M + 4, y - bx + 1.5, bx, bx);
    if (checked) { stroke(ACC); doc.setLineWidth(1.6); doc.line(M + 6.5, y - 4, M + 9, y - 1.2); doc.line(M + 9, y - 1.2, M + 13.5, y - 8.5); }
    lines.forEach((w, k) => { doc.text(w, M + 24, y + k * lh); });
    if (amt) doc.text(amt, M + W, y, { align: "right" });
    y += lines.length * lh + 1;
  };
  const infoBox = (rows) => {
    const lh = 17; need(rows.length * lh + 16);
    fill(TINT); doc.roundedRect(M, y - 4, W, rows.length * lh + 14, 4, 4, "F");
    y += 11;
    rows.forEach(([k, v]) => {
      font("bold", 10, SOFT); doc.text(k.toUpperCase(), M + 12, y);
      font("normal", 11, INK); doc.text(wrap(v, W - 110)[0], M + 96, y);
      y += lh;
    });
    y += 4;
  };

  sections.forEach((text, si) => {
    if (si > 0) { doc.addPage(); y = M; }
    const lines = String(text).split("\n");
    let k = 0, isOrder = false, inInfo = [];
    const flushInfo = () => { if (inInfo.length) { infoBox(inInfo); inInfo = []; } };
    if (lines[0] && /^(MATERIALS TO ORDER|STILL TO GET)/.test(lines[0])) {
      isOrder = true;
      const m = lines[0].split(" — ");
      header(m[0].replace(/^./, (c) => c) .replace(/MATERIALS TO ORDER/, "Materials to order").replace(/STILL TO GET/, "Still to get"), (m.slice(1).join(" — ") || bizName || "").slice(0, 90));
      k = 1;
      if (lines[1]) { para(lines[1].replace("tick [x] when ordered", "tick the box when ordered"), { size: 9.5, color: SOFT }); k = 2; }
      gap(4);
    } else {
      bizName = lines[0] || ""; k = 1;
      if (/^INVOICE/.test(lines[1] || "")) { header(bizName || "Invoice", "Invoice"); k = 2; gap(6); }
      else if (/^QUOTATION/.test(lines[1] || "")) { header(bizName || "Quotation", "Quotation"); para("Fixed price for the work described below.", { size: 9.5, color: SOFT, style: "italic" }); k = 2; gap(6); }
      else { header(bizName || "Estimate", "Provisional estimate");
      if (lines[1]) { para("For the office to prepare the quote. This is not a customer quote.", { size: 9.5, color: SOFT, style: "italic" }); k = 2; gap(6); } }
    }
    for (; k < lines.length; k++) {
      const ln = lines[k], t = ln.trim();
      let m;
      if (!t) { flushInfo(); gap(5); continue; }
      if ((m = /^(Customer|Site|Surveyed|Date|Valid until|Invoice number|Invoice date|Payment due|VAT number|Insurer|Owner|Landlord|Letting agent|Working for|Their job reference|Paid by|Claim reference|Reference|Job \/ works order number|Order \/ PO number|Policy holder|Tenant|Contact|Invoice to): (.*)$/.exec(ln))) {
        if (m[1] === "Surveyed" || m[1] === "Date" || m[1] === "Invoice date") dateStr = m[2].split(" · ")[0];
        inInfo.push([m[1] === "Surveyed" ? "Survey" : m[1], m[2]]); continue;
      }
      flushInfo();
      if (/^[A-Z]{3,}[A-Z0-9 ,()'\/&.-]*[^:]*:$/.test(ln) && ln.length < 120 && !/^\s/.test(ln)) { heading(ln); continue; }
      if ((m = /^\s*\[( |x)\] (.*)$/.exec(ln))) {
        const mm = MONEY.exec(m[2]);
        mm ? tick(m[1] === "x", lab(mm), mm[2]) : tick(m[1] === "x", m[2]); continue;
      }
      if ((m = /^(\s*)- (.*)$/.exec(ln))) {
        const lvl = m[1].length >= 2 ? 1 : 0, mm = MONEY.exec(m[2]);
        const cut = m[2].lastIndexOf(" — ");
        if (mm && lvl) { money(lab(mm), mm[2], { indent: 12, size: 10, color: SOFT }); }
        else if (lvl && cut > 0) { money(m[2].slice(0, cut), m[2].slice(cut + 3), { indent: 12, size: 10, color: SOFT }); }
        else bullet(m[2], lvl);
        continue;
      }
      if ((m = /^(Total labour(?: \(estimated\))?): (.*)$/.exec(ln))) { gap(6); money(m[1], m[2], { style: "bold" }); continue; }
      if ((m = /^(Materials at cost): (£[\d,]+(?:\.\d+)?)(?: \((.*)\))?$/.exec(ln))) { money(m[1], m[2], { style: "bold" }); if (m[3]) para(m[3].replace(/^includes/, "Includes"), { size: 9, color: SOFT, indent: 0 }); continue; }
      if ((m = MONEY.exec(t))) {
        const isTotal = /^(total|quote total|estimated total|grand total)\b/i.test(m[1]) && !/materials at cost/i.test(m[1]);
        const isGroup = !/^\s/.test(ln) && !isTotal && isOrder === false && /^[A-Z][^:]*$/.test(m[1]) && lines[k + 1] && /^\s+- /.test(lines[k + 1]);
        if (isTotal || /total/i.test(m[1]) && /£/.test(m[2]) && !/^\s/.test(ln) && k > 2) money(lab(m), m[2], { style: "bold", size: 12, box: true, color: ACC });
        else if (isGroup) { gap(3); money(lab(m), m[2], { style: "bold", rule: true }); }
        else money(lab(m), m[2], { indent: /^\s/.test(ln) ? 12 : 0 });
        continue;
      }
      if (isOrder && /:$/.test(t) && !/^\s/.test(ln)) {
        if (/^(ONLY IF NEEDED|PROVISIONAL TASKS|OPTION)/.test(t)) { heading(t); continue; }
        need(64); gap(6); font("bold", 11, INK); doc.text(t.replace(/:$/, ""), M, y); y += 16; continue;
      }
      if (/^DISCLAIMER:/.test(ln)) { heading(ln); continue; }
      if (/^\s{2,}\S/.test(ln)) { para(t, { indent: 12, size: 10, color: SOFT }); continue; }
      const small = /^(Not VAT registered|Please pay by|Thank you for your business|Hours are estimates|Please quote for this|Please quote for these|Please quote both|Choose one option|Prices are fixed|These tasks are only)/.test(t);
      para(t, small ? { size: 9.5, color: SOFT } : {});
    }
    flushInfo();
  });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); font("normal", 8.5, SOFT);
    stroke(RULE); doc.setLineWidth(0.5); doc.line(M, PH - 40, M + W, PH - 40);
    doc.text((bizName ? bizName + " · " : "") + (dateStr || ""), M, PH - 26);
    doc.text("Page " + i + " of " + pages, M + W, PH - 26, { align: "right" });
  }
  };
  /* if the nicer layout ever fails on a device, fall back to the plain text PDF so sending never breaks */
  const plainPdf = (doc) => {
    const M = 48, W = 595 - M * 2; let y = M;
    sections.forEach((text, si) => {
      if (si > 0) { doc.addPage(); y = M; }
      String(text).split("\n").forEach((line) => {
        const head = line.length > 3 && line === line.toUpperCase() && /[A-Z]/.test(line);
        doc.setFont("helvetica", head ? "bold" : "normal"); doc.setFontSize(head ? 12 : 10.5); doc.setTextColor(0, 0, 0);
        doc.splitTextToSize(line || " ", W).forEach((w) => { if (y > 790) { doc.addPage(); y = M; } doc.text(w, M, y); y += head ? 17 : 14; });
      });
    });
  };
  let doc = new lib({ unit: "pt", format: "a4" });
  try { prettyPdf(doc); } catch (err) { doc = new lib({ unit: "pt", format: "a4" }); plainPdf(doc); }
  return deliverPdf(doc, filename);
}

/* hand a finished PDF to the phone's share sheet, or download it */
async function deliverPdf(doc, filename) {
  const blob = doc.output("blob");
  const file = new File([blob], filename, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return "shared"; }
    catch (err) { if (err && err.name === "AbortError") return "cancelled"; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return "downloaded";
}

function SharePdf({ sections, filename, label, cls }) {
  const [state, setState] = useState("idle");
  const [msg, setMsg] = useState("");
  const go = async () => {
    setState("working"); setMsg("");
    try {
      const r = await makeAndSharePdf(sections, filename);
      setState(r === "downloaded" ? "downloaded" : "idle");
      if (r !== "cancelled") { try { window.dispatchEvent(new Event("jobpricer:sent")); } catch (e) { /* ignore */ } }
    } catch (err) { setState("error"); setMsg(String(err && err.message ? err.message : err)); }
  };
  return html`<div className=${cls || ""}>
    <button type="button" className="btn btn-accent" onClick=${go} disabled=${state === "working"}><${Icon} name="file" /> ${state === "working" ? "Making PDF..." : label}</button>
    ${state === "downloaded" ? html`<p className="bar-sub" style=${{ margin: "4px 0 0" }}>PDF saved. Attach it in WhatsApp as a document.</p>` : null}
    ${state === "error" ? html`<p className="bar-sub" style=${{ margin: "4px 0 0" }}>${msg}</p>` : null}
  </div>`;
}

function QuoteView(p) {
  const { calc, survey, markup, tier, scopeItems: scopeBase, sizeLabel, businessName, setBusinessName, customerName, setCustomerName,
    siteAddress, setSiteAddress, officeNotes, setOfficeNotes, todayStr, onBack, ticks, setTick } = p;
  const rateOn = !!(ticks && ticks["rate:on"]), rateVal = Math.min(100, Math.max(0, Number(ticks && ticks["rate:val"]) || 0));
  const labourCost = rateOn ? calc.totalHours * rateVal : 0;
  const direct = isDirect(ticks);
  const validUntil = (() => { const d = new Date(); d.setDate(d.getDate() + 30); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric" }); })();
  const g = (k) => ticks && ticks[k];
  const sv = (k, v) => { if (setTick) setTick(k, v); };
  const chg = chargeOf(g);
  const [terms, setTerms] = useTerms();
  const VRq = direct ? vatRate(terms) : 0;
  const trades0 = tradeList(ticks).concat(extraLines(g).map((x, i) => ({ key: "ex" + i, tag: "", label: x[0], scope: "", cost: x[1], ref: "" })));
  const base0 = calc.materialsBase + (calc.supply > 0 ? calc.supply : 0) + labourCost + trades0.reduce((a, x) => a + x.cost, 0);
  const topUp = chg.min > 0 && !(calc.o2Items || []).length && base0 < chg.min ? chg.min - base0 : 0;
  const trades = trades0.concat(topUp > 0 ? [{ key: "min", tag: "", label: "Minimum charge top-up (minimum charge " + fmt(chg.min) + ")", scope: "", cost: topUp, ref: "" }] : []), tradeTotal = trades.reduce((a, x) => a + x.cost, 0);
  const scopeItems = scopeBase.concat(trades.filter((x) => x.scope).map((x) => x.scope + (x.ref ? " (" + x.ref + ")" : "")));
  /* invoice: the option chosen, plus any provisional items that turned out to be needed */
  const [pay, setPay] = usePay();
  const hasO2 = (calc.o2Items || []).length > 0, ONq = optNames(ticks, calc);

function useAuth() {
  const [user, setUser] = useState(null);
  const [ready, setReady] = useState(!sb);
  useEffect(() => {
    if (!sb) return undefined;
    let sub = null;
    try {
      sb.auth.getSession().then(({ data }) => { setUser(data && data.session ? data.session.user : null); setReady(true); }).catch(() => setReady(true)); /* offline: keep whatever login is already known */
      sub = sb.auth.onAuthStateChange((_e, s) => setUser(s ? s.user : null)).data.subscription;
    } catch (e) { setReady(true); }
    return () => { if (sub) sub.unsubscribe(); };
  }, []);
  return { user, ready };
}

function SavePanel({ kind, auth, defaultTitle, autoTitle, address, setAddress, getData, currentId, onSaved, onNeedLogin }) {
  const [title, setTitle] = useState("");
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const shown = autoTitle ? defaultTitle || "" : title || defaultTitle || "";
  const save = async (auto) => {
    if (!auth.user) { if (!auto) onNeedLogin(); return; }
    setBusy(true); setStatus("");
    const row = { kind, title: shown.trim() || "Untitled " + KIND_LABEL[kind].toLowerCase(), data: getData(), updated_at: new Date().toISOString() };
    try {
      let res;
      if (currentId) res = await sb.from("pricer_jobs").update(row).eq("id", currentId).select("id").single();
      else res = await sb.from("pricer_jobs").insert(row).select("id").single();
      if (res.error) setStatus("Not saved: " + res.error.message);
      else { onSaved(res.data.id); setStatus(auto === true ? "Saved automatically ✓" : "Saved ✓"); }
    } catch (e) { setStatus("Not saved. Check your connection."); }
    setBusy(false);
  };
  /* save the job on its own once it has been sent (PDF, copied estimate, copied order list or job notes) */
  const saveRef = useRef(save); saveRef.current = save;
  useEffect(() => {
    const onSent = () => { setTimeout(() => saveRef.current(true), 0); };
    window.addEventListener("jobpricer:sent", onSent);
    return () => window.removeEventListener("jobpricer:sent", onSent);
  }, []);
  return html`<div className="card link-row" style=${{ margin: "18px 0 0" }}>
    ${autoTitle && setAddress ? html`<input className="text-in grow" type="text" aria-label="Job address (also the saved job name)" placeholder="Job address (saved as the job name)" value=${address} onChange=${(e) => setAddress(e.target.value)} />` : autoTitle ? html`<span className="note grow">${shown ? "Saves as: " + shown : "Saves under the job address"}</span>` : html`<input className="text-in grow" type="text" aria-label="Job name" placeholder="Job name (customer or address)" value=${shown} onChange=${(e) => setTitle(e.target.value)} />`}

function useRoom(room, tier) {
  const [fixtures, setFixtures] = useState(() => blankFixtures(room));
  const [structural, setStructural] = useState(() => blankStructural(room));
  const [kit, setKit] = useState({});
  const [hrs, setHrs] = useState({});
  const [prov, setProv] = useState({});
  const [prices, setPrices] = useState({});
  const [srcs, setSrcs] = useState({});
  const [bulk, setBulk] = useState([]);
  const [bulkOnly, setBulkOnly] = useState(false);
  const survey = useMemo(() => computeSurvey(room, fixtures, structural, kit, tier, hrs, prov, prices, srcs, bulk, bulkOnly), [room, fixtures, structural, kit, tier, hrs, prov, prices, srcs, bulk, bulkOnly]);
  const ctx = useMemo(() => makeCtx({ prices, srcs, bulk, bulkOnly, setPrices, setSrcs, setBulk, setBulkOnly }), [prices, srcs, bulk, bulkOnly]);
  const snap = () => ({ fixtures, structural, kit, hrs, prov, prices, srcs, bulk, bulkOnly });
  const restore = (d) => {
    setFixtures({ ...blankFixtures(room), ...(d.fixtures || {}) }); setStructural({ ...blankStructural(room), ...(d.structural || {}) });
    setKit(d.kit || {}); setHrs(d.hrs || {}); setProv(d.prov || {}); setPrices(d.prices || {}); setSrcs(d.srcs || {}); setBulk(d.bulk || []); setBulkOnly(!!d.bulkOnly);
  };
  return {
    snap, restore,
    fixtures, structural, kit, hrs, prov, survey, ctx,
    updateFixture: (key, patch) => setFixtures((s) => ({ ...s, [key]: { ...s[key], ...patch } })),
    updateStructural: (key, val) => setStructural((s) => ({ ...s, [key]: val })),
    toggleKit: (id, item, altId) => setKit((prev) => {
      const cur = id in prev ? prev[id] : !item.opt;
      const next = { ...prev, [id]: !cur };
      if (!cur && altId) next[altId] = false;
      return next;
    }),
    setHr: (key, v) => setHrs((p) => ({ ...p, [key]: v })),
    toggleProv: (k) => setProv((p) => ({ ...p, [k]: !p[k] })),
    clearAll: () => { setFixtures(blankFixtures(room)); setStructural(blankStructural(room)); setKit({}); setHrs({}); setProv({}); setPrices({}); setSrcs({}); setBulk([]); setBulkOnly(false); },
  };
}

const addMonths = (iso, m) => { if (!iso) return ""; const d = new Date(iso + "T12:00:00"); if (isNaN(d)) return ""; d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const fmtDate = (iso) => (iso ? iso.split("-").reverse().join("/") : "");
const dueOf = (j, c) => (j.due && j.due[c[0]]) || addMonths(j.done && j.done[c[0]], c[2]);
const emptyJob = () => ({ ...EMPTY_JOB, date: localYmd() });
const EMPTY_JOB = { jobType: "", date: "", where: "", issue: "", issueWhere: "", work: "", hours: "", x: {}, mats: [], checks: {}, done: {}, due: {}, noAddr: false, orders: [], bulk: [], rateOn: false, rate: "", complete: false, reports: {}, resolved: "", resolvedNote: "", further: "", tradeNeeded: false, trade: "", tradeNote: "" };
function jobNoteText(j) {
  const L = [];
  const d = j.date || new Date().toLocaleDateString("en-GB");
  L.push("JOB NOTES — " + d);
  if (j.jobType.trim()) L.push("Job: " + j.jobType.trim());
  if (!j.noAddr && j.where.trim()) L.push("Location: " + j.where.trim());
  clientLines((k) => (j.x || {})[k]).forEach((x) => L.push(x));
  if (j.issue.trim()) L.push("Issue: " + j.issue.trim());
  if (j.issueWhere.trim()) L.push("Where in property: " + j.issueWhere.trim());
  if (j.work.trim()) L.push("Work carried out: " + j.work.trim());
  if (j.resolved) L.push("Issue resolved: " + (j.resolved === "yes" ? "Yes" : j.resolved === "partly" ? "Partly" : "No") + ((j.resolved !== "yes" && (j.resolvedNote || "").trim()) ? " — " + j.resolvedNote.trim() : ""));
  const h = Number(j.hours);
  if (j.hours !== "" && !isNaN(h)) L.push("Time taken: " + fmtDays(h) + (h === 1 ? " hour" : " hours"));
  if (j.rateOn && Number(j.rate) > 0 && j.hours !== "" && !isNaN(h)) L.push("Labour at £" + Math.min(100, Number(j.rate)) + " an hour: " + fmtKit(h * Math.min(100, Number(j.rate))));
  const ms = (j.mats || []).filter((x) => x.item.trim() || x.where.trim() || (x.cost !== "" && Number(x.cost) > 0));
  if (ms.length) {
    L.push("Materials:");
    let tot = 0;
    ms.forEach((x) => {
      const q = Math.max(1, Math.floor(Number(x.qty)) || 1);
      const c = Math.max(0, Number(x.cost) || 0) * q; tot += c;
      L.push("- " + (x.item.trim() || "Materials") + (q > 1 ? " × " + q : "") + (x.code && x.code.trim() ? " [code " + x.code.trim() + "]" : "") + (x.where.trim() ? " (" + x.where.trim() + ")" : "") + (x.unk && !(c > 0) ? " — price TBC" : " — " + fmtKit(c)));
    });
    if (ms.length > 1) L.push("Total materials: " + fmtKit(tot));
  }
  const bk = (j.bulk || []).filter((x) => (x.what || "").trim() || (Number(x.cost) > 0));
  if (bk.length) {
    L.push("Materials already bought / from stock:");
    bk.forEach((x) => L.push("- " + ((x.what || "").trim() || "Bulk buy") + ((x.where || "").trim() ? " (" + x.where.trim() + ")" : "") + " — " + fmtKit(Math.max(0, Number(x.cost) || 0))));
    if (ms.length || bk.length > 1) L.push("Total including bulk buys: " + fmtKit(ms.reduce((a, x) => a + Math.max(0, Number(x.cost) || 0) * Math.max(1, Math.floor(Number(x.qty)) || 1), 0) + bk.reduce((a, x) => a + Math.max(0, Number(x.cost) || 0), 0)));
  }
  const vu = (j.van || []);
  if (vu.length) {
    L.push("Van stock used:");
    vu.forEach((x) => { const q = Math.max(1, Math.floor(Number(x.qty)) || 1), c = Math.max(0, Number(x.price) || 0) * q; L.push("- " + x.name + (q > 1 ? " × " + q : "") + (x.code ? " [code " + x.code + "]" : "") + (c > 0 ? " — " + fmtKit(c) : "")); });
    if (vanUsedTotal(j) > 0) L.push("Van stock total: " + fmtKit(vanUsedTotal(j)));
    const rs = vu.filter((x) => x.re);
    if (rs.length) L.push("To restock: " + rs.map((x) => Math.max(1, Math.floor(Number(x.qty)) || 1) + " x " + x.name).join(", "));
  }
  const ords = (j.orders || []).filter((o) => (o.from || "").trim() || (o.ref || "").trim() || (o.address || "").trim() || (o.items || "").trim());
  if (ords.length) {
    L.push("Orders placed:");
    ords.forEach((o) => {
      L.push("- " + ((o.from || "").trim() || "Supplier") + ((o.items || "").trim() ? ": " + o.items.trim() : "") + ((o.ref || "").trim() ? " — ref " + o.ref.trim() : "") + (!j.noAddr && (o.address || "").trim() ? " — for " + o.address.trim() : ""));
    });
  }
  L.push("Work status: " + (j.complete ? "COMPLETE" : "NOT yet complete") + ((j.x || {}).jobstatus ? " · " + statusLabel(j.x.jobstatus) : ""));
  if ((j.further || "").trim()) L.push("Further work required: " + j.further.trim());
  if (j.tradeNeeded) L.push("Another trade required to attend: " + ((j.trade || "").trim() || "trade not stated") + ((j.tradeNote || "").trim() ? " — " + j.tradeNote.trim() : ""));
  const req = CHECKS.filter((c) => j.checks && j.checks[c[0]]);
  if (req.length) {
    L.push("Checks required at this property:");
    req.forEach((c) => {
      const done = j.done && j.done[c[0]], due = dueOf(j, c);
      const rp = reportStarted(j, c[0]) ? (REPORT_FORMS[c[0]].title + (reportVals(j, c[0], "").outcome ? ": " + optLabel({ t: "sg", o: OUTCOME_OPTS }, reportVals(j, c[0], "").outcome) : "")) : "";
      L.push("- " + c[1] + (done ? " — completed " + fmtDate(done) : " — not yet completed") + (due ? ", next due " + fmtDate(due) : "") + (rp ? " — report: " + rp : ""));
    });
  }
  return L.join("\n");
}
/* where a check stands: derived from the dates already on the job, nothing new is stored */
function checkState(j, c) {
  const done = j.done && j.done[c[0]], due = dueOf(j, c);
  if (!done && !due) return { tone: "warn", label: "Not done yet", rank: 1 };
  const d = daysFromToday(due);
  if (!isNaN(d) && d < 0) return { tone: "bad", label: "Overdue since " + fmtDate(due), rank: 0 };
  if (!isNaN(d) && d <= 60) return { tone: "warn", label: "Due " + fmtDate(due) + " (" + d + (d === 1 ? " day" : " days") + ")", rank: 2 };
  if (!done) return { tone: "warn", label: "Not done yet", rank: 1 };
  return { tone: "ok", label: "In date to " + fmtDate(due), rank: 3 };
}
/* the job's stage, worked out from what has been filled in (work status, resolved, orders, further work, trade) */
function jobStatus(j) {
  const T = (v) => !!(v || "").toString().trim();
  const hasOrder = (j.orders || []).some((o) => T(o.from) || T(o.ref) || T(o.items));
  const logged = T(j.jobType) || T(j.issue);
  const worked = T(j.work) || (j.hours !== "" && j.hours != null && !isNaN(Number(j.hours)));
  const open = j.resolved === "partly" || j.resolved === "no";
  const follow = T(j.further) || !!j.tradeNeeded || open;
  let title, tone, next;
  if (j.complete && !follow) { title = "Complete"; tone = "ok"; next = "Copy the job notes and send them to the landlord or agent."; }
  else if (j.complete) { title = "Complete, follow-up needed"; tone = "warn"; next = "Say what is still outstanding in Work status, then copy the job notes."; }
  else if (j.tradeNeeded) { title = "Waiting on another trade"; tone = "warn"; next = "Note which trade and what they need to do, so the agent can book them."; }
  else if (hasOrder) { title = "Waiting on parts"; tone = "warn"; next = "Come back once the order arrives. The order reference is in the job notes."; }
  else if (T(j.further) || open) { title = "Return visit needed"; tone = "warn"; next = "Put what is left in 'Further work required' so the next visit starts quickly."; }
  else if (logged || worked) { title = "In progress"; tone = "go"; next = "Tick 'Work is complete' in Work status when you leave."; }
  else { title = "New job"; tone = ""; next = "Start with what the job is. Everything else can wait until you have done it."; }
  const missing = [];
  if (logged || worked) {
    if (!j.resolved) missing.push("Has the issue been resolved? is not answered");
    if (!worked) missing.push("No work or time recorded");
    if (!T(j.where) && !j.noAddr) missing.push("No address (or tick 'No address needed')");
  }
  const flags = [!!logged, !!worked, j.resolved === "yes", !!j.complete];
  return { title, tone, next, missing, steps: flowSteps(["Logged", "Work done", "Fixed", "Closed"], flags) };
}
const JOB_QUICK = ["Leaking tap", "Leak under sink", "No hot water", "Radiator fault", "Blocked toilet or drain", "Damp or mould report", "Landlord safety checks visit"];
function JobStatus({ job }) { return null; /* decluttered */

    <${GlasgowTips} kind="job" />
  <//>`;
}

      setView("form"); setMode("survey");
    } else if (row.kind === "kitchen") {
      k.restore(d); if (d.tier) setTier(d.tier); setKCustomer(d.kCustomer || ""); setKSite(d.kSite || ""); setKNotes(d.kNotes || ""); setKSupply(d.kSupply || ""); setKSource(d.kSource || ""); setKSupplier(typeof d.kSupplier === "string" ? d.kSupplier : "Howdens");
      setKview("form"); setMode("kitchen");
    } else if (row.kind === "heating") {
      hr.restore(d); if (d.tier) setTier(d.tier); setHCustomer(d.hCustomer || ""); setHSite(d.hSite || ""); setHNotes(d.hNotes || "");
      setHview("form"); setMode("heating");
    } else {
      setSjob({ ...EMPTY_JOB, ...d }); setMode("small");
    }
    setJobId(row.kind, row.id);
  };
  const todayStr = useMemo(() => new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric" }), []);

  /* baselines: what each screen looked like untouched, or as last saved / opened. Work that differs from them is worth keeping as a draft. */
  const initJ = useRef(null);
  if (initJ.current === null) initJ.current = { bath: JSON.stringify(bathSnap()), kitchen: JSON.stringify(kitchenSnap()), heating: JSON.stringify(heatSnap()), small: JSON.stringify(sjob) };
  const rebase = useRef(null);
  const baseKey = (kind) => (kind === "bathroom" ? "bath" : kind);
  const snapJ = (kind) => JSON.stringify(kind === "bathroom" ? bathSnap() : kind === "kitchen" ? kitchenSnap() : kind === "heating" ? heatSnap() : sjob);
  const isDirty = () => ["bathroom", "kitchen", "heating", "small"].some((kd) => snapJ(kd) !== initJ.current[baseKey(kd)]);
  const [draft, setDraft] = useState(() => loadDraft());
  const [oldD, setOldD] = useState(() => loadDraft(OLD_KEY));
  const saved = (kind, id) => { setJobId(kind, id); initJ.current[baseKey(kind)] = snapJ(kind); };
  const openSavedGuarded = (row) => {
    if (snapJ(row.kind) !== initJ.current[baseKey(row.kind)] && !window.confirm("Opening this job replaces what is on screen for that job type. Anything you have not saved will be lost. Open it?")) return;
    openSaved(row);
    rebase.current = row.kind;
  };
  const carryOn = (d, isOld) => {
    if (!d) return;
    if (isDirty() && !window.confirm("This replaces the work you have started since. Carry on with the draft anyway?")) return;
    const ids = d.ids || {};
    if (d.small) setSjob({ ...EMPTY_JOB, ...d.small });
    if (d.kitchen) openSaved({ kind: "kitchen", data: d.kitchen, id: ids.kitchen || null });
    if (d.heating) openSaved({ kind: "heating", data: d.heating, id: ids.heating || null });
    if (d.bath) openSaved({ kind: "bathroom", data: d.bath, id: ids.bathroom || null });
    setJobId("small", ids.small || null);
    setMode(d.mode === "kitchen" || d.mode === "heating" || d.mode === "small" ? d.mode : "survey");
    if (isOld) { try { localStorage.removeItem(OLD_KEY); } catch (err) { /* ignore */ } setOldD(null); } else setDraft(null);
  };
  const discardDraft = (d, isOld) => {
    try {
      if (isOld) localStorage.removeItem(OLD_KEY);
      else { const cur = loadDraft(); if (cur && d && cur.ts === d.ts) localStorage.removeItem(DRAFT_KEY); }
    } catch (err) { /* ignore */ }
    if (isOld) setOldD(null); else setDraft(null);
  };
  /* undo for "clear all" / "new job": keeps what was on screen for a short while */
  const [undo, setUndo] = useState(null);
  useEffect(() => { if (!undo) return undefined; const t = setTimeout(() => setUndo(null), 20000); return () => clearTimeout(t); }, [undo]);
  const withUndo = (kind, fn) => () => {
    setUndo({ kind, data: JSON.parse(snapJ(kind)), id: jobIds[kind] || null, mode });
    fn();
  };
  const doUndo = () => { if (!undo) return; const back = undo.mode; openSaved({ kind: undo.kind, data: undo.data, id: undo.id }); if (back) setMode(back); setUndo(null); };
  /* after opening a saved job, treat what is now on screen as the clean baseline */
  useEffect(() => {
    if (rebase.current) { initJ.current[baseKey(rebase.current)] = snapJ(rebase.current); rebase.current = null; }
  });
  /* autosave a draft a moment after every change. If an unanswered draft is still waiting, it is moved to a backup key first, never overwritten. */
  useEffect(() => {
    const t = setTimeout(() => {
      try {
        const cur = loadDraft();
        if (!isDirty()) { if (cur && (!draft || cur.ts !== draft.ts)) localStorage.removeItem(DRAFT_KEY); return; }
        if (draft && cur && cur.ts === draft.ts) { localStorage.setItem(OLD_KEY, JSON.stringify(cur)); setOldD(cur); setDraft(null); }
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ ts: Date.now(), mode: mode === "kitchen" || mode === "heating" || mode === "small" ? mode : "survey", bath: bathSnap(), kitchen: kitchenSnap(), heating: heatSnap(), small: sjob, ids: jobIds }));
      } catch (err) { /* storage unavailable */ }
    }, 800);
    return () => clearTimeout(t);
  });

  useEffect(() => { savePrefs({ tier, businessName, kSupplier }); }, [tier, businessName, kSupplier]);
  /* every screen opens at the top */
  useEffect(() => { try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }, [mode, view, kview, hview]);
  /* hide the bottom bars while a keyboard is up (phones only, see CSS) */
  useEffect(() => {
    const isText = (t) => !!t && (t.tagName === "TEXTAREA" || t.tagName === "SELECT" || (t.tagName === "INPUT" && !/^(checkbox|radio|button|range|submit)$/.test(t.type)));
    let tm = 0;
    const on = (e) => {
      clearTimeout(tm);
      if (isText(e.target)) document.body.classList.add("kb");
      if (e.target && e.target.tagName === "INPUT" && e.target.type === "number") { try { e.target.select(); } catch (err) { /* ignore */ } }
    };
    const off = () => { clearTimeout(tm); tm = setTimeout(() => document.body.classList.remove("kb"), 80); };
    document.addEventListener("focusin", on); document.addEventListener("focusout", off);
    return () => { clearTimeout(tm); document.removeEventListener("focusin", on); document.removeEventListener("focusout", off); document.body.classList.remove("kb"); };
  }, []);

  const updateFixture = (key, patch) => { setIsExample(false); setFixtures((s) => ({ ...s, [key]: { ...s[key], ...patch } })); };
  const updateStructural = (key, val) => { setIsExample(false); setStructural((s) => ({ ...s, [key]: val })); };
  const toggleKit = (id, item, altId) => {
    setIsExample(false);
    setKit((prev) => {
      const cur = id in prev ? prev[id] : !item.opt;
      const next = { ...prev, [id]: !cur };
      if (!cur && altId) next[altId] = false;
      return next;
    });
  };
  const clearAll = () => { setDims({ fl: "", fw: "", ch: "" }); setFixtures(blankFixtures()); setStructural(blankStructural()); setKit({}); setHrs({}); setProv({}); setPrices({}); setSrcs({}); setBulk([]); setBulkOnly(false); setIsExample(false); setLayoutChange(false); setTiling("none"); setElectrical("none"); setPlastering(false); setJobId("bathroom", null); };
  const toggleProv = (k) => setProv((p) => ({ ...p, [k]: !p[k] }));
  const setHr = (key, v) => setHrs((prev) => ({ ...prev, [key]: v }));

  const survey = useMemo(() => computeSurvey(BATHROOM, fixtures, structural, kit, tier, hrs, prov, prices, srcs, bulk, bulkOnly, size), [fixtures, structural, kit, tier, hrs, prov, prices, srcs, bulk, bulkOnly, size]);

  const calc = useMemo(() => {
    const o2x = []; let o2h = 0;
    const mv = (key, h, label) => { if (h > 0 && xTag(prov, key) === "o2") { o2h += h; o2x.push({ label, hours: h, materials: 0 }); return 0; } return h; };
    const layoutHours = mv("layout", layoutChange ? hrOf(hrs, "x-layout", DEF_H) : 0, "Soil pipe reroute for repositioned WC");
    const plumbHours = survey.hours.plumbing + layoutHours;
    const joinerHours = survey.hours.joinery;
    const wetWallHours = survey.hours.wetwall;
    const flooringHours = survey.hours.flooring;
    const tileHours = mv("tile", tiling === "none" ? 0 : hrOf(hrs, "x-tile-" + tiling + "-" + size, DEF_H), tiling === "full" ? "Full retile" : "Part-tiling");
    const elecHours = mv("elec", electrical === "none" ? 0 : hrOf(hrs, "x-elec-" + electrical, DEF_H), electrical === "shower" ? "Shower electrical circuit" : "Lighting circuit");
    const plasterHours = mv("plaster", plastering ? hrOf(hrs, "x-plaster-" + tiling + "-" + size, DEF_H) : 0, "Plastering / making good");
    const totalHours = plumbHours + joinerHours + wetWallHours + flooringHours + tileHours + elecHours + plasterHours;
    const tileMaterials = 0; const tileNeeded = TILE_AREA[tiling][size] > 0;
    const sundriesNeeded = totalHours > 0 && !bathCtx.prices["sund:off"]; const sundries = sundriesNeeded ? sundriesOf(survey.materials + tileMaterials, bathCtx.prices) : 0;
    const materialsBase = survey.materials + tileMaterials + sundries;
    const materialsWithMarkup = materialsBase * (1 + markup / 100);
    return {
      plumbHours, joinerHours, wetWallHours, flooringHours, tileHours, elecHours, plasterHours, totalHours,
      materialsBase, materialsWithMarkup,
      provHours: survey.prov.hours,
      provMaterials: survey.prov.materials * (1 + markup / 100),
      tileMaterials, sundries, tileNeeded, sundriesNeeded,
      provItems: survey.prov.items.map((i) => ({ ...i, materials: i.materials * (1 + markup / 100) })),
      o2Hours: survey.o2.hours + o2h, o2Materials: survey.o2.materials * (1 + markup / 100),
      o2Items: survey.o2.items.map((i) => ({ ...i, materials: i.materials * (1 + markup / 100) })).concat(o2x),
    };
  }, [survey, size, tier, layoutChange, tiling, electrical, plastering, markup, hrs, bathCtx.prices, prov]);

  const kcalc = useMemo(() => {
    const h = k.survey.hours;
    const totalHours = h.plumbing + h.joinery + h.wetwall + h.flooring + h.tiling + (h.elec || 0);
    const sundriesNeeded = totalHours > 0 && !k.ctx.prices["sund:off"]; const sundries = sundriesNeeded ? sundriesOf(k.survey.materials, k.ctx.prices) : 0;
    const materialsBase = k.survey.materials + sundries;
    const m = 1 + markup / 100;
    return {
      plumbHours: h.plumbing, joinerHours: h.joinery, wetWallHours: 0, flooringHours: h.flooring, tileHours: h.tiling, elecHours: h.elec || 0, plasterHours: 0,
      totalHours, materialsBase, materialsWithMarkup: materialsBase * m, tileMaterials: 0, sundries, tileNeeded: false, sundriesNeeded,
      supply: Math.max(0, Number(kSupply) || 0), supplyLabel: "Kitchen units (" + kSupplierName + ")" + (kSource.trim() ? " — " + kSource.trim() : ""),
      provHours: k.survey.prov.hours, provMaterials: k.survey.prov.materials * m,
      provItems: k.survey.prov.items.map((i) => ({ ...i, materials: i.materials * m })),
      o2Hours: k.survey.o2.hours, o2Materials: k.survey.o2.materials * m,
      o2Items: k.survey.o2.items.map((i) => ({ ...i, materials: i.materials * m })),
    };
  }, [k.survey, markup, kSupply, kSource, kSupplierName, k.ctx.prices]);

  const hcalc = useMemo(() => {
    const h = hr.survey.hours;
    const totalHours = h.plumbing + h.joinery + h.wetwall + h.flooring + h.tiling + (h.elec || 0);
    const sundriesNeeded = totalHours > 0 && !hr.ctx.prices["sund:off"]; const sundries = sundriesNeeded ? sundriesOf(hr.survey.materials, hr.ctx.prices) : 0;
    const materialsBase = hr.survey.materials + sundries;
    return {
      plumbHours: h.plumbing, joinerHours: h.joinery, wetWallHours: 0, flooringHours: h.flooring, tileHours: h.tiling, elecHours: h.elec || 0, plasterHours: 0,
      totalHours, materialsBase, materialsWithMarkup: materialsBase, tileMaterials: 0, sundries, tileNeeded: false, sundriesNeeded, supply: 0, supplyLabel: "",
      provHours: hr.survey.prov.hours, provMaterials: hr.survey.prov.materials, provItems: hr.survey.prov.items,
      o2Hours: hr.survey.o2.hours, o2Materials: hr.survey.o2.materials, o2Items: hr.survey.o2.items,
    };
  }, [hr.survey, hr.ctx.prices]);

  const scopeItems = useMemo(() => {
    const items = [...survey.scope];
    const inMain = (k) => xTag(prov, k) !== "o2";
    if (layoutChange && inMain("layout")) items.push("Soil pipe reroute for repositioned WC");
    if (tiling !== "none" && inMain("tile")) items.push(tiling === "full" ? "Full retile" : "Part-tiling");
    if (electrical !== "none" && inMain("elec")) items.push(electrical === "shower" ? "Shower electrical circuit" : "Lighting circuit");
    if (plastering && inMain("plaster")) items.push("Plastering / making good");
    return items;
  }, [survey, layoutChange, tiling, electrical, plastering, prov]);

  const surveyHours = survey.hours.plumbing + calc.joinerHours + calc.wetWallHours + calc.flooringHours;

  /* which jobs have work on screen that differs from untouched or last saved (shown as a dot on the tab and a resume strip on the other tabs) */
  const dirtyMap = { survey: snapJ("bathroom") !== initJ.current.bath, kitchen: snapJ("kitchen") !== initJ.current.kitchen, heating: snapJ("heating") !== initJ.current.heating, small: snapJ("small") !== initJ.current.small };
  const resumeList = [["small", "Maintenance"], ["survey", "Bathroom"], ["kitchen", "Kitchen"], ["heating", "Heating"]].filter(([id]) => dirtyMap[id] && !(id === "survey" ? (mode === "survey" || mode === "calculator") : mode === id));

  return html`<div className="wrap">
    <${AppHeader} businessName=${businessName} />
    ${[[draft, false], [oldD, true]].map(([d, isOld]) => (d ? html`<div key=${isOld ? "old" : "cur"} className="tip" role="alert">
      <b>${isOld ? "Older draft found" : "Unsaved work found"}</b>
      <p className="note" style=${{ margin: "4px 0 10px" }}>A draft from ${new Date(d.ts).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })} was kept on this phone. Carry on with it, or start fresh.</p>
      <div className="mat-act" style=${{ marginTop: 0 }}>
        <button type="button" className="btn btn-accent" onClick=${() => carryOn(d, isOld)}>Carry on</button>
        <${ConfirmBtn} label="Discard" armedLabel="Tap again to discard" onConfirm=${() => discardDraft(d, isOld)} />
      </div>
    </div>` : null))}
    ${resumeList.length > 0 ? html`<div className="resume" role="status"><span>Jobs in progress:</span>
      ${resumeList.map(([id, lbl]) => html`<button type="button" key=${id} className="rchip" onClick=${() => setMode(id)}>${lbl}: carry on</button>`)}</div>` : null}
    ${mode === "book" && html`<${PriceBookView} auth=${auth} />`}
    ${mode === "jobs" && html`<${MyJobsView} auth=${auth} onOpen=${openSavedGuarded} />`}


    ${mode === "small" && html`<${HomeCard} />`}
    ${mode === "small" && html`<${SmallJobView} bizName=${businessName} job=${sjob} setJob=${setSjob} onClear=${withUndo("small", () => { setSjob(emptyJob()); setJobId("small", null); })} />`}

    ${mode === "survey" && html`<${PriceCtx.Provider} value=${bathCtx}><${SiteSurveyView} room=${BATHROOM} size=${size} setSize=${setSize} dims=${dims} setDims=${changeDims} fixtures=${fixtures} structural=${structural} kit=${kit} tier=${tier} setTier=${setTier}
      updateFixture=${updateFixture} updateStructural=${updateStructural} toggleKit=${toggleKit}
      customerName=${customerName} setCustomerName=${setCustomerName} siteAddress=${siteAddress} setSiteAddress=${setSiteAddress}
      survey=${survey} calc=${calc} isExample=${isExample} onClear=${withUndo("bathroom", clearAll)} hrs=${hrs} setHr=${setHr} prov=${prov} toggleProv=${toggleProv}
      extra=${{ layoutChange, setLayoutChange, tiling, setTiling, electrical, setElectrical, plastering, setPlastering, prov, toggleProv }}
      onViewQuote=${() => { setMode("calculator"); setView("quote"); }} /><//>`}

    ${mode === "calculator" && view === "quote" && html`<${QuoteView} calc=${calc} survey=${survey} markup=${markup} tier=${tier} scopeItems=${scopeItems} sizeLabel=${roomLabel(size, dims) + " bathroom"}
      businessName=${businessName} setBusinessName=${setBusinessName} customerName=${customerName} setCustomerName=${setCustomerName}
      siteAddress=${siteAddress} setSiteAddress=${setSiteAddress} officeNotes=${officeNotes} setOfficeNotes=${setOfficeNotes}
      todayStr=${todayStr} ticks=${bathCtx.prices} setTick=${bathCtx.setPrice} onBack=${() => setMode("survey")} />`}

    ${mode === "kitchen" && kview === "form" && html`<${PriceCtx.Provider} value=${k.ctx}><${SiteSurveyView} room=${KITCHEN} supplySource=${kSource} setSupplySource=${setKSource} supply=${kSupply} setSupply=${setKSupply} supplyLabel=${"Kitchen units (" + kSupplierName + ")"} supplier=${kSupplier} setSupplier=${setKSupplier} fixtures=${k.fixtures} structural=${k.structural} kit=${k.kit} tier=${tier} setTier=${setTier}
      updateFixture=${k.updateFixture} updateStructural=${k.updateStructural} toggleKit=${k.toggleKit}
      customerName=${kCustomer} setCustomerName=${setKCustomer} siteAddress=${kSite} setSiteAddress=${setKSite}
      survey=${k.survey} calc=${kcalc} isExample=${false} onClear=${withUndo("kitchen", () => { k.clearAll(); setJobId("kitchen", null); })} hrs=${k.hrs} setHr=${k.setHr} prov=${k.prov} toggleProv=${k.toggleProv}
      onViewQuote=${() => setKview("quote")} /><//>`}

    ${mode === "kitchen" && kview === "quote" && html`<${QuoteView} calc=${kcalc} survey=${k.survey} markup=${markup} tier=${tier} scopeItems=${k.survey.scope} sizeLabel="Kitchen"
      businessName=${businessName} setBusinessName=${setBusinessName} customerName=${kCustomer} setCustomerName=${setKCustomer}
      siteAddress=${kSite} setSiteAddress=${setKSite} officeNotes=${kNotes} setOfficeNotes=${setKNotes}
      todayStr=${todayStr} ticks=${k.ctx.prices} setTick=${k.ctx.setPrice} onBack=${() => setKview("form")} />`}

    ${mode === "heating" && hview === "form" && html`<${PriceCtx.Provider} value=${hr.ctx}><${SiteSurveyView} room=${HEATING} fixtures=${hr.fixtures} structural=${hr.structural} kit=${hr.kit} tier=${tier} setTier=${setTier}
      updateFixture=${hr.updateFixture} updateStructural=${hr.updateStructural} toggleKit=${hr.toggleKit}
      customerName=${hCustomer} setCustomerName=${setHCustomer} siteAddress=${hSite} setSiteAddress=${setHSite}
      survey=${hr.survey} calc=${hcalc} isExample=${false} onClear=${withUndo("heating", () => { hr.clearAll(); setJobId("heating", null); })} hrs=${hr.hrs} setHr=${hr.setHr} prov=${hr.prov} toggleProv=${hr.toggleProv}
      onViewQuote=${() => setHview("quote")} /><//>`}

    ${mode === "heating" && hview === "quote" && html`<${QuoteView} calc=${hcalc} survey=${hr.survey} markup=${markup} tier=${tier} scopeItems=${hr.survey.scope} sizeLabel="Heating"
      businessName=${businessName} setBusinessName=${setBusinessName} customerName=${hCustomer} setCustomerName=${setHCustomer}
      siteAddress=${hSite} setSiteAddress=${setHSite} officeNotes=${hNotes} setOfficeNotes=${setHNotes}
      todayStr=${todayStr} ticks=${hr.ctx.prices} setTick=${hr.ctx.setPrice} onBack=${() => setHview("form")} />`}
    ${mode === "heating" && html`<${SavePanel} bottom=${true} kind="heating" auth=${auth} autoTitle=${true} defaultTitle=${hSite.trim() || hCustomer.trim()} getData=${heatSnap}
      currentId=${jobIds.heating} onSaved=${(id) => saved("heating", id)} onNeedLogin=${() => setMode("jobs")} />`}

    ${(mode === "survey" || mode === "calculator") && html`<${SavePanel} bottom=${true} kind="bathroom" auth=${auth} autoTitle=${true} defaultTitle=${siteAddress.trim() || customerName.trim()} getData=${bathSnap}
      currentId=${jobIds.bathroom} onSaved=${(id) => saved("bathroom", id)} onNeedLogin=${() => setMode("jobs")} />`}
    ${mode === "kitchen" && html`<${SavePanel} bottom=${true} kind="kitchen" auth=${auth} autoTitle=${true} defaultTitle=${kSite.trim() || kCustomer.trim()} getData=${kitchenSnap}
      currentId=${jobIds.kitchen} onSaved=${(id) => saved("kitchen", id)} onNeedLogin=${() => setMode("jobs")} />`}
    ${mode === "small" && html`<${SavePanel} bottom=${true} kind="small" auth=${auth} autoTitle=${true} defaultTitle=${(sjob.where || "").trim() || (sjob.jobType || "").trim()} getData=${() => sjob}
      currentId=${jobIds.small} onSaved=${(id) => saved("small", id)} onNeedLogin=${() => setMode("jobs")} />`}

    ${undo ? html`<div className="undo" role="status"><span>${undo.kind === "small" ? "Job cleared." : "Cleared."}</span>
      <button type="button" className="btn go" onClick=${doUndo}>Undo</button>
      <button type="button" className="btn" aria-label="Dismiss" onClick=${() => setUndo(null)}>OK</button></div>` : null}
    <nav className="tabbar" aria-label="Main">
      ${TABS.map(([id, icon, lbl]) => {
        const on = id === "survey" ? (mode === "survey" || mode === "calculator") : mode === id;
        return html`<button type="button" key=${id} aria-pressed=${on} aria-label=${lbl + (dirtyMap[id] ? " (job in progress)" : "")} aria-current=${on ? "page" : undefined} className=${"tabbtn" + (on ? " on" : "")}
          onClick=${() => { if (on && mode === id && !(id === "kitchen" && kview === "quote") && !(id === "heating" && hview === "quote")) { try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { /* ignore */ } } else { setMode(id); if (id === "kitchen") setKview("form"); if (id === "heating") setHview("form"); } }}><span className="tabico"><${Icon} name=${icon} />${dirtyMap[id] ? html`<i className="tabdot" aria-hidden="true" title="Job in progress"></i>` : null}</span><span>${lbl}</span></button>`;
      })}
    </nav>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
